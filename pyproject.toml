[project]
name = "latam-bank-pipeline"
version = "0.1.0"
description = "Data pipeline, analysis and evaluation for the LATAM bank service"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "tabulate>=0.9",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "boto3>=1.35",
    "google-cloud-bigquery>=3.25",
    "dbt-core>=1.10,<1.12",
    "dbt-bigquery>=1.10,<1.12",
    "dbt-duckdb>=1.9,<1.12",
]

[tool.uv]
package = false
