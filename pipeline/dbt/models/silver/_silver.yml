version: 2

# Silver contracts. Every rule id (A5, C1, E1, ...) is defined in docs/data-issues.md; `_rule_flags` on each row
# lists the rules that touched it, and reports/silver_quality.md counts them per run.

models:
  - name: silver_customers
    description: "Customers, full population. Identity fields live only here (the serving slice drops or hashes them)."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country
        description: "ISO 3166-1 alpha-2 (D3)."
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['MX', 'CO', 'AR']}}
      - name: timezone
        data_tests: [not_null]
      - name: document_type
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['DNI', 'CC', 'CE', 'PASSPORT', 'CURP']}}
      - name: segment
        data_tests:
          - accepted_values: {arguments: {values: ['Premium', 'Plus', 'Basic', 'Student']}}
      - name: customer_status
        data_tests:
          - accepted_values: {arguments: {values: ['Active', 'Inactive', 'Suspended', 'Closed']}}
      - name: credit_score
        data_tests:
          - between: {arguments: {min_value: 300, max_value: 850}}

  - name: silver_products
    description: "Accounts, cards and loans. Every product's customer exists."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_customers'), field: customer_id}}
      - name: product_type
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['savings_account', 'checking_account', 'credit_card', 'debit_card', 'personal_loan', 'mortgage', 'investment', 'insurance']}}
      - name: currency
        data_tests:
          - accepted_values: {arguments: {values: ['USD', 'COP', 'ARS', 'MXN']}}

  - name: silver_transactions
    description: "Transactions, full population (4.4M). Read by the dispute lookup (docs/contracts.md K2) through the serving slice."
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_customers'), field: customer_id}}
      - name: product_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_products'), field: product_id}}
      - name: transaction_ts
        description: "UTC timestamp as delivered."
        data_tests: [not_null]
      - name: transaction_date_local
        description: "Calendar day in the customer's home time zone (A2)."
        data_tests: [not_null]
      - name: amount
        data_tests:
          - not_null
          - between: {arguments: {min_value: 0, max_value: 1000000000}}
      - name: currency
        description: "The record's own currency; never converted for display (A5)."
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['USD', 'COP', 'ARS', 'MXN']}}
      - name: amount_usd
        description: "Delivered, or derived from the daily rate when missing (amount_usd_derived = true, A5/A6)."
        data_tests: [not_null]
      - name: transaction_status
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['Approved', 'Declined', 'Pending', 'Reversed']}}
      - name: transaction_country
        data_tests:
          - accepted_values: {arguments: {values: ['MX', 'CO', 'AR', 'US', 'ES', 'BR']}}
      - name: fraud_score
        description: "Policy engine only (PL-6); never shown to the customer."
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 100}}

  - name: silver_complaints
    description: "Complaints (PQR). is_dispute marks the workflow's two subcategories (D-002). affected_product_id is NULL wherever it pointed to another customer's product (C1)."
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_customers'), field: customer_id}}
      - name: subcategory
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['unrecognized_charge', 'wrongful_fee', 'app_problem', 'branch_service', 'service_quality']}}
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: ['Open', 'In Process', 'Escalated', 'Resolved', 'Closed', 'Rejected']}}
      - name: currency
        data_tests:
          - accepted_values: {arguments: {values: ['USD', 'COP', 'ARS', 'MXN']}}

  - name: silver_call_center_interactions
    description: "Contacts, full population. contact_reason is dropped (identical to reason_category, D2)."
    columns:
      - name: interaction_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_customers'), field: customer_id}}
      - name: agent_id
        data_tests:
          - relationships: {arguments: {to: ref('silver_service_agents'), field: agent_id}}
      - name: reason_category
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['transactional', 'product', 'complaint', 'technical', 'commercial', 'retention']}}
      - name: channel
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ['phone', 'email', 'app', 'whatsapp', 'web_chat', 'web_video']}}
      - name: sentiment
        data_tests:
          - accepted_values: {arguments: {values: ['very_positive', 'positive', 'neutral', 'negative', 'very_negative']}}

  - name: silver_satisfaction_surveys
    columns:
      - name: survey_id
        data_tests: [unique, not_null]
      - name: main_score
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 10}}
      - name: nps_category
        description: "Recomputed from the score for NPS surveys (E5)."
        data_tests:
          - accepted_values: {arguments: {values: ['Promoter', 'Passive', 'Detractor']}}

  - name: silver_call_transcripts
    columns:
      - name: transcript_id
        data_tests: [unique, not_null]
      - name: interaction_id
        data_tests:
          - relationships: {arguments: {to: ref('silver_call_center_interactions'), field: interaction_id}}

  - name: silver_service_agents
    columns:
      - name: agent_id
        data_tests: [unique, not_null]
      - name: specialty
        data_tests:
          - accepted_values: {arguments: {values: ['fraud', 'collections', 'retention', 'tech_support', 'credit', 'investments', 'sales', 'complaints']}}

  - name: silver_branches
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
  - name: silver_marketing_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
  - name: silver_campaign_sends
    columns:
      - name: send_id
        data_tests: [unique, not_null]
  - name: silver_digital_events
    description: "15.6M app/web events; anonymous_event marks the 24% without a customer (A7)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
  - name: silver_fx_rates
    columns:
      - name: exchange_rate
        data_tests:
          - not_null
          - between: {arguments: {min_value: 0, max_value: 100000}}
